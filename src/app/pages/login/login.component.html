<div class="-container">
  <img src="../../../assets/salaDeJuegosLogin2.gif" alt="">
</div>
<div class="terminal-container">
  <div class="terminal-header">
    <span>Online Web Terminal - Sala de Juegos</span>
  </div>
  <div class="terminal-body">
    <pre class="terminal-line">Booting system...</pre>
    <pre class="terminal-line">Loading authentication module...</pre>
    <pre class="terminal-line">Access granted. Please login.</pre>

    <pre class="terminal-prompt">https://sala-de-juegos-57a52.web.app/$</pre>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <label class="terminal-label">usuario:</label>
      <input type="email" formControlName="username" class="terminal-input" placeholder="correo@ejemplo.com" />
      <div class="error-space">
        <div *ngIf="submitted && loginForm.get('username')?.errors?.['required']" class="error">
          ❌ El correo es requerido.
        </div>
        <div *ngIf="submitted && loginForm.get('username')?.errors?.['email']" class="error">
          ⚠️ El correo no es válido.
        </div>
      </div>

      <label class="terminal-label">contraseña:</label>
      <input type="password" formControlName="password" class="terminal-input" placeholder="********" />
      <div class="error-space">
        <div *ngIf="submitted && loginForm.get('password')?.errors?.['required']" class="error">
          ❌ La contraseña es requerida.
        </div>
      </div>

      <button type="submit" class="terminal-button">Acceder</button>
    </form>
  </div>
</div>
