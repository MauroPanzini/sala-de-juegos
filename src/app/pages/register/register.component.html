<div class="login-container background">
    <div class="login-box">
      <h2>Registrar cuenta</h2>
      <form (ngSubmit)="register()">
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Correo electrónico"
          required
        />
        <div *ngIf="submitted && !email" class="error">
          El correo es requerido.
        </div>
        <div *ngIf="submitted && email && !isValidEmail(email)" class="error">
          El correo no es válido.
        </div>
  
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Contraseña"
          required
        />
        <div *ngIf="submitted && !password" class="error">
          La contraseña es requerida.
        </div>
  
        <button type="submit">Registrar</button>
      </form>
  
      <br>
  
      <button class="register-button" (click)="goToLogin()">
        ¿Ya tienes una cuenta? Inicia sesión
      </button>
    </div>
  </div>
