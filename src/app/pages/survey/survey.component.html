<div class="encuesta-container">
  <form [formGroup]="encuestaForm" (ngSubmit)="onSubmit()" class="encuesta-form">
    <h2>Encuesta de juegos</h2>

    <div class="form-grid">
      <!-- Columna Izquierda -->
      <div class="col-izq">
        <div class="form-group">
          <label>Nombre:</label>
          <input type="text" formControlName="nombre" />
          <div *ngIf="encuestaForm.get('nombre')?.invalid && encuestaForm.get('nombre')?.touched" class="error">
            Este campo es obligatorio.
          </div>
        </div>

        <div class="form-group">
          <label>Apellido:</label>
          <input type="text" formControlName="apellido" />
          <div *ngIf="encuestaForm.get('apellido')?.invalid && encuestaForm.get('apellido')?.touched" class="error">
            Este campo es obligatorio.
          </div>
        </div>

        <div class="form-group">
          <label>Edad:</label>
          <input type="number" formControlName="edad" />
          <div *ngIf="encuestaForm.get('edad')?.errors?.['min'] || encuestaForm.get('edad')?.errors?.['max']" class="error">
            La edad debe estar entre 18 y 99 años.
          </div>
        </div>

        <div class="form-group">
          <label>Teléfono:</label>
          <input type="text" formControlName="telefono" />
          <div *ngIf="encuestaForm.get('telefono')?.errors?.['pattern']" class="error">
            Solo se permiten números y máximo 10 caracteres.
          </div>
        </div>

        <div class="form-group">
          <label>¿Cuál es tu juego favorito?</label>
          <input type="text" formControlName="juegoFavorito" />
        </div>
      </div>

      <!-- Columna Derecha -->
      <div class="col-der">
        <div class="form-group">
          <label>¿Qué consolas usás?</label>
          <div>
            <label><input type="checkbox" formControlName="usaPlay" /> PlayStation</label>
          </div>
          <div>
            <label><input type="checkbox" formControlName="usaXbox" /> Xbox</label>
          </div>
          <div>
            <label><input type="checkbox" formControlName="usaPc" /> PC</label>
          </div>
        </div>

        <div class="form-group">
          <label>¿Preferís juegos online u offline?</label>
          <div>
            <label><input type="radio" formControlName="preferencia" value="Online" /> Online</label>
          </div>
          <div>
            <label><input type="radio" formControlName="preferencia" value="Offline" /> Offline</label>
          </div>
        </div>
      </div>
    </div>

    <button type="submit" [disabled]="encuestaForm.invalid">Enviar</button>
  </form>
</div>
