<!-- PANTALLA INICIAL -->
<div *ngIf="!gameStarted && !gameOver" class="game-card">
  <h1>Buscaminas</h1>
  <button class="button" (click)="startGame()">Jugar</button>
</div>

<!-- TABLERO SIEMPRE QUE EL JUEGO ESTÉ INICIADO -->
<div *ngIf="gameStarted" class="game-container">
  <!-- Cabecera -->
  <div class="game-header">
    <div class="header-item left">⏱️ {{ timer }}s</div>
    <div class="header-item center">⭐ {{ score }}</div>
    <div class="header-item right">💣 {{ minesLeft }}</div>
  </div>
  <div class="game-mode-selector">
    <button [class.active]="mode === 'reveal'" (click)="changeMode('reveal')">
      <img
        src="../../../../assets/icons/cursor.png"
        alt="Cursor"
        class="icon-button"
      />
    </button>
    <button [class.active]="mode === 'flag'" (click)="changeMode('flag')">
      <img
        src="../../../../assets/icons/flag.png"
        alt="Bandera"
        class="icon-button"
      />
    </button>
    <button
      [class.active]="mode === 'question'"
      (click)="changeMode('question')"
    >
      <img
        src="../../../../assets/icons/question.png"
        alt="Pregunta"
        class="icon-button"
      />
    </button>
  </div>

  <!-- TABLERO -->
  <div class="minesweeper-container">
    <div class="board">
      <div *ngFor="let row of board; let i = index" class="row">
        <div
          *ngFor="let cell of row; let j = index"
          class="cell"
          [ngClass]="{
            revealed: cell.revealed || (gameOver && cell.mine),
            flagged: cell.flag,
            questioned: cell.question,
            mine: cell.revealed && cell.mine
          }"
          (click)="onCellClick(i, j)"
          (contextmenu)="onRightClick($event, i, j)"
        >
          <ng-container *ngIf="cell.revealed || (gameOver && cell.mine)">
            <img
              *ngIf="cell.mine"
              src="../../../../assets/icons/mine.png"
              alt="Mina"
              class="mine-icon"
            />
            <span *ngIf="!cell.mine">{{ cell.adjacentMines || "" }}</span>
          </ng-container>
          <ng-container *ngIf="!cell.revealed && !(gameOver && cell.mine)">
            <img
              *ngIf="cell.flag"
              src="../../../../assets/icons/flag.png"
              alt="Bandera"
              class="mine-icon"
            />
            <img
              *ngIf="cell.question"
              src="../../../../assets/icons/question.png"
              alt="Pregunta"
              class="mine-icon"
            />
          </ng-container>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MENSAJE DE FIN DE JUEGO -->
<div *ngIf="gameOver" class="start-menu">
  <h2>¡Juego terminado!</h2>
  <p>Puntaje final: {{ score }}</p>
  <p *ngIf="newHighScoreMsg">{{ newHighScoreMsg }}</p>
  <button (click)="restartGame()" class="button">Jugar de nuevo</button>
  <div class="minesweeper-container">
    <div class="board">
      <div *ngFor="let row of board; let i = index" class="row">
        <div
          *ngFor="let cell of row; let j = index"
          class="cell"
          [ngClass]="{
            revealed: cell.revealed || (gameOver && cell.mine),
            flagged: cell.flag,
            questioned: cell.question,
            mine: cell.revealed && cell.mine
          }"
        >
          <ng-container *ngIf="cell.revealed || (gameOver && cell.mine)">
            <img
              *ngIf="cell.mine"
              src="../../../../assets/icons/mine.png"
              alt="Mina"
              class="mine-icon"
            />
            <span *ngIf="!cell.mine">{{ cell.adjacentMines || "" }}</span>
          </ng-container>
          <ng-container *ngIf="!cell.revealed && !(gameOver && cell.mine)">
            <img
              *ngIf="cell.flag"
              src="../../../../assets/icons/flag.png"
              alt="Bandera"
              class="mine-icon"
            />
            <img
              *ngIf="cell.question"
              src="../../../../assets/icons/question.png"
              alt="Pregunta"
              class="mine-icon"
            />
          </ng-container>
        </div>
      </div>
    </div>
  </div>
</div>
