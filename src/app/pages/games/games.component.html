<div class="games-container" *ngIf="showCards">
  <div class="games-container">
    <div class="card" (click)="navigateToGame('ahorcado')">
      <img src="assets/icons/hagnman-icon.png" alt="Ahorcado" />
      <span>Ahorcado</span>
    </div>

    <div class="card" (click)="navigateToGame('preguntados')">
      <img src="assets/icons/International_Pokémon_logo.svg.png" alt="Preguntados" />
      <span>Preguntados</span>
    </div>

    <div class="card" (click)="navigateToGame('mayor-menor')">
      <img src="assets/icons/espada.png" alt="Mayor o Menor" />
      <span> Mayor o Menor </span>
    </div>

    <div class="card" (click)="navigateToGame('buscaminas')">
      <img src="assets/icons/mine.png" alt="Buscaminas" />
      <span>Buscaminas</span>
    </div>
  </div>
</div>

<router-outlet></router-outlet>
